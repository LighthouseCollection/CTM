# CTM role registry (project-plan template v2.4 §5.1; decisions D-0025, D-0040).
# The one source for the launcher, the dispatcher and CI. Replaces agent-limits.yaml.
# Documents name a setting (`slots`), never its value (check 15). Adjust values
# here only; the Delivery Lead logs a change on a `decision` issue, and the owner
# can change them any time by commenting there.
# Checked by scripts/check_registry.cjs (fast gates). Syntax is a plain YAML
# subset (maps, lists of maps, [inline, lists], scalars) so Node reads it with
# scripts/lib/registry.cjs and no package install.

settings:
  # D-0025 (owner, unchanged): long work = a screen or service, a design, a migration, a release.
  slots: 4                     # concurrent long-work sessions
  # D-0025: gate and short tasks run on top of slots, so no slot is held back for them.
  reserved_gate_slots: 0
  short_tasks_max: unlimited   # D-0025: any number of short tasks (or a number)
  short_task_cap_min: 15       # D-0025: longer -> stop and queue for a long-work slot
  memory_limit_default: 1.5G   # D-0025: each session's own limit
  start_new_below_free_gb: 2   # D-0025: no new session while free host memory is below this
  # D-0040: template v2.4 defaults.
  idle_exit_min: 5             # an idle session exits and frees its slot
  stall_min: 15                # no activity while work is assigned = stalled
  heartbeat_min: 10            # poller interval (mode P, D-0039)
  ready_min: 3                 # Ready items per active lane
  ready_label: status:ready
  in_progress_label: status:in-progress
  refill_role: ctm3-product-lead
  priority: [release, integrate, verify, build, design, spec, evergreen]

roles:
  # ---- Lane agents (template §5.3) ----
  - id: ctm3-product-lead
    kind: lane
    lane: spec
    label: agent:ctm3-product-lead
    instances: 1
    parked: false
    source: charter
    model: opus
    definition: .claude/agents/ctm3-product-lead.md
    skills: [ctm-slice, ctm-owner-interview]
    wakes_on: [issue_opened, comment_mention, ready_below_min, release_done, heartbeat]
    memory_limit: 1.5G
  - id: ctm3-design-director
