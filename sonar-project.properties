# SonarQube Community quality gate for CTM (SDLC phase 4).
sonar.projectKey=lighthouse-ctm
sonar.projectName=CTM
sonar.sources=tribunal,ctm,static/ctm,scripts
sonar.tests=tests
sonar.exclusions=tribunal/migrations/**,static/ctm/demo-*/**,docs/**,**/*.svg,**/*.png
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8
# The quality gate applies to new code; existing debt is reported, not blocking.
