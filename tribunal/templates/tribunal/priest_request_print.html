<!doctype html>
<html lang="{% if language == 'ar' %}ar{% else %}en{% endif %}" dir="{% if language == 'ar' %}rtl{% else %}ltr{% endif %}">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <style>
    @page { size: A4; margin: 20mm; }
    body { font-family: "DejaVu Sans", sans-serif; max-width: 170mm; margin: 20mm auto; color: #000; background: #fff; }
    h1, p { overflow-wrap: anywhere; }
    .instructions { white-space: pre-wrap; }
    .identifier { font-size: 9pt; }
    .line { height: 9mm; border-bottom: 1px solid #999; break-inside: avoid; }
    @media print { body { margin: 0; max-width: none; } }
  </style>
</head>
<body>
  <h1 dir="{{ title_direction }}">{{ title }}</h1>
  <p class="identifier"><bdi>{{ request_id }}</bdi></p>
  <p dir="{{ subject_name_direction }}">{{ subject_name }}</p>
  {% if priest_name %}<p dir="{{ priest_name_direction }}">{{ priest_name }}</p>{% endif %}
  {% if instructions %}<p class="instructions" dir="{{ instructions_direction }}">{{ instructions }}</p>{% endif %}
  <div aria-hidden="true">{% for line in lines %}<div class="line"></div>{% endfor %}</div>
</body>
</html>
