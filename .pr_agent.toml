# PR-Agent (The-PR-Agent/pr-agent) settings for CTM. Advisory independent review.
[pr_reviewer]
extra_instructions = """
CTM is a church tribunal case-management app (Django 5.2, PostgreSQL RLS, React 18 with the Plenix CDN design system, English/Arabic RTL).
Flag as high priority: missing server-side permission checks; applicant data visible to another applicant (fields, files, search, counts, logs);
Professional Assessment data leaving its signed release scope or sent to an external AI; raw SQL without RLS actor context;
migrations without reverse; mock or fake success (payment, email, scan, OCR); raw colors, inline styles or custom CSS instead of Plenix;
user-visible strings missing English or Arabic; history or original submissions overwritten.
Follow CLAUDE.md and docs/implementation/sdlc.md.
"""
require_tests_review = true
require_security_review = true
num_max_findings = 10

[pr_description]
publish_labels = true
