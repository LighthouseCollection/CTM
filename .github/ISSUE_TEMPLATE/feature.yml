name: Feature
description: Something new CTM should do
title: "Feature: "
labels: ["type:feature"]
body:
  - type: markdown
    attributes:
      value: Describe the outcome you want. ctm3-product-lead writes the spec and applies sensible defaults instead of waiting; it reports every choice on this issue.
  - type: textarea
    id: goal
    attributes:
      label: What should CTM do
      description: Who uses it and what they get done
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Rules, wording, examples. Say "show me options" if you want pictures.
