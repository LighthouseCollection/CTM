name: CTM database paths owner
# #67: only ctm3-database-engineer changes tribunal/migrations/, tribunal/db/ and
# deploy/postgres/. pull_request_target runs MAIN's copy of this workflow and of
# scripts/db_owner_guard.cjs, so a PR cannot weaken the check by editing it, and
# the PR's code is never checked out or run. Approval = same-repository branch +
# the 'agent:ctm3-database-engineer' label applied by someone with write access.
# workflow_dispatch (write access only) covers bot PRs, which start no workflows:
# plenix-upgrade.yml dispatches it on its branch with the PR number; the script
# then requires that PR's head to be the dispatched commit.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] main's code only; the PR head is never checked out
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number whose head is the dispatched commit
        required: true
        type: number

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: db-owner-guard-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  guard:
    name: Database paths owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Always main's code: the PR base on pull_request_target, main on dispatch.
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          persist-credentials: false
          sparse-checkout: scripts/db_owner_guard.cjs
          sparse-checkout-cone-mode: false
      - name: Database-owned paths need the database engineer's label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          EXPECT_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || '' }}
        run: node scripts/db_owner_guard.cjs
