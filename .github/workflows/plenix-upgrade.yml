name: Plenix CDN auto-upgrade
# Keeps CTM on the newest Plenix (PDS) CDN release with no human step:
# detect a new version -> update every pin -> validate against the real CDN
# (frontend tests, shell tests, browser smoke with screenshots) -> merge.
# If validation fails, it opens one bug issue with the logs and screenshots.
# Hold CTM on a version by adding "ctm": "<version>" to pins in cdn/latest.json.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Plenix version (default: latest)'
        required: false
  repository_dispatch:
    types: [plenix-release]   # sent by the PDS release agent through the PDS GitHub App (D-0027)

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write   # start quality.yml, backend.yml and db-owner-guard.yml on the upgrade branch

concurrency:
  group: plenix-upgrade
  cancel-in-progress: false

# Explicit bash adds -o pipefail, so `check | tee log` fails when the check fails.
# Without it a failing check piped to tee reports success (run 41932216907).
defaults:
  run:
    shell: bash

jobs:
  upgrade:
    runs-on: ubuntu-latest
    # Same isolated PostgreSQL as backend.yml: CTM migrations use PostgreSQL-only
    # SQL, so the shell tests cannot build their database on SQLite.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ctm_validation
          POSTGRES_USER: ctm_validation
          POSTGRES_PASSWORD: ci-isolated-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ctm_validation"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CTM_TEST_DATABASE_URL: postgres://ctm_validation:ci-isolated-only@localhost:5432/ctm_validation
      DJANGO_SECRET_KEY: ci-only-not-production
      # PDS GitHub App (D-0027). The app id is not secret; it only tells the
      # report step whether the app is set up yet.
      PDS_APP_ID: ${{ secrets.PDS_APP_ID }}
      # A bot token makes the merge trigger the normal CI/deploy workflows;
      # GITHUB_TOKEN works but its pushes do not start other workflows.
      GH_TOKEN: ${{ secrets.CTM_BOT_TOKEN || secrets.GITHUB_TOKEN }}
      REQUESTED: ${{ github.event.inputs.version || github.event.client_payload.version || 'latest' }}
    steps:
      # Keeps credentials: this job pushes the upgrade and screenshot branches.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # zizmor: ignore[artipacked] (v4)
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.CTM_BOT_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Detect new Plenix version
        id: bump
        run: |
          old=$(node scripts/bump_plenix.cjs --current)
          out=$(node scripts/bump_plenix.cjs "$REQUESTED")
          echo "$out"
          new=$(node scripts/bump_plenix.cjs --current)
          echo "old=$old" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"
          if [ "$old" = "$new" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          branch="bot/plenix-$new"
          if gh issue list --state open --search "Plenix $new breaks CTM in:title" --json number --jq '.[0].number' | grep -q .; then
            echo "Plenix $new failed validation before (open issue); not retrying"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # An open upgrade PR younger than an hour belongs to a run that is still
          # waiting for it. Older, it is stuck (#254: no checks, or a conflict):
          # close it and build a fresh one on today's main. A leftover branch with
          # no open PR is stale too.
          pr=$(gh pr list --head "$branch" --state open --json number,createdAt --jq '.[0] // empty')
          if [ -n "$pr" ]; then
            num=$(jq -r .number <<<"$pr"); age=$(( ($(date +%s) - $(date -d "$(jq -r .createdAt <<<"$pr")" +%s)) / 60 ))
            if [ "$age" -lt 60 ]; then
              echo "#$num for $new is $age minutes old; its run is still on it"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            gh pr close "$num" --comment "Stuck for $age minutes without merging; replaced by a fresh upgrade PR on the current main (run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}). — ctm3-release-engineer (plenix-upgrade.yml)"
            echo "stuck=#$num for Plenix $new was open $age minutes without merging; closed and rebuilt on the current main." >> "$GITHUB_OUTPUT"
          fi
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        if: steps.bump.outputs.changed == 'true'
        with:
          version: '0.8.22'
      - name: Install app and browser
        if: steps.bump.outputs.changed == 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
          uv sync --frozen --python 3.12 --group browser
          uv run --group browser playwright install --with-deps chromium

      - name: Every referenced CDN file exists at the new version
        id: files
        if: steps.bump.outputs.changed == 'true'
        continue-on-error: true
        run: node scripts/bump_plenix.cjs --verify 2>&1 | tee .files.log
      - name: Pins and styling (changed files)
        id: contract
        if: steps.bump.outputs.changed == 'true'
        continue-on-error: true
        run: node scripts/check_frontend_contract.cjs --base HEAD 2>&1 | tee .contract.log
      - name: Frontend contract tests
        id: node
        if: steps.bump.outputs.changed == 'true'
        continue-on-error: true
        run: node --test tests/frontend/*.test.cjs 2>&1 | tee .node.log
      - name: Provision runtime roles in the test database (as backend.yml)
        if: steps.bump.outputs.changed == 'true'
        env:
          CTM_APP_PASSWORD: ci-ctm-app-only
          CTM_WORKER_PASSWORD: ci-ctm-worker-only
        run: |
          db="${{ job.services.postgres.id }}"
          docker cp deploy/postgres/init.sql "$db:/tmp/ctm-init.sql"
          docker exec -i --env CTM_APP_PASSWORD --env CTM_WORKER_PASSWORD --env CTM_INIT_SQL=/tmp/ctm-init.sql "$db" bash -s < deploy/postgres/00-init-roles.sh
      - name: Shell tests (PostgreSQL)
        id: shell
        if: steps.bump.outputs.changed == 'true'
        continue-on-error: true
        run: uv run pytest --ds=ctm.settings_postgres_test -q tests/test_shell.py 2>&1 | tee .shell.log
      - name: Browser check against the real CDN (screenshots)
        id: smoke
        if: steps.bump.outputs.changed == 'true'
        continue-on-error: true
        run: uv run --group browser python scripts/browser_cdn_smoke.py 2>&1 | tee .smoke.log

      - name: Publish screenshots to the dashboard branch
        id: shots
        if: steps.bump.outputs.changed == 'true' && always()
        run: |
          dir="plenix/${{ steps.bump.outputs.new }}/${{ github.run_id }}"
          md=""
          if ls .tmp/*.png >/dev/null 2>&1; then
            git config user.name "ctm-bot"; git config user.email "ctm-bot@users.noreply.github.com"
            if git fetch -q origin ci-screenshots 2>/dev/null; then
              git worktree add -q -B ci-screenshots /tmp/shots origin/ci-screenshots
            else
              git worktree add -q --detach /tmp/shots && (cd /tmp/shots && git switch -q --orphan ci-screenshots)
            fi
            mkdir -p "/tmp/shots/$dir" && cp .tmp/*.png "/tmp/shots/$dir/"
            (cd /tmp/shots && git add "$dir" && git commit -qm "Screenshots: Plenix ${{ steps.bump.outputs.new }} run ${{ github.run_id }}" && git push -q origin ci-screenshots)
            for f in .tmp/*.png; do n=$(basename "$f"); md="$md"$'\n'"**$n**"$'\n'"![$n](https://github.com/${{ github.repository }}/blob/ci-screenshots/$dir/$n?raw=true)"$'\n'; done
          fi
          { echo 'md<<EOF'; echo "$md"; echo 'EOF'; } >> "$GITHUB_OUTPUT"

      - name: Merge the upgrade (all checks passed)
        id: merge
        if: steps.bump.outputs.changed == 'true' && steps.files.outcome == 'success' && steps.contract.outcome == 'success' && steps.node.outcome == 'success' && steps.shell.outcome == 'success' && steps.smoke.outcome == 'success'
        env:
          SHOTS: ${{ steps.shots.outputs.md }}
          BRANCH: ${{ steps.bump.outputs.branch }}
          NEW: ${{ steps.bump.outputs.new }}
          HAS_BOT_TOKEN: ${{ secrets.CTM_BOT_TOKEN != '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Four tries with back-off: one GitHub HTTP 500 on a dispatch stranded 1.2.0 (#254).
          retry() { local n; for n in 1 2 3 4; do "$@" && return 0; echo "::warning::try $n failed: $*" >&2; sleep $((n * 15)); done; return 1; }
          if [ "$HAS_BOT_TOKEN" != true ]; then
            echo "::warning::CTM_BOT_TOKEN is not set: the PR is made with GITHUB_TOKEN, so this run starts its checks and the deploy itself (#254)"
          fi
          node scripts/bump_plenix.cjs --verify   # second guard: never merge a pin whose CDN files are missing
          git config user.name "ctm-bot"; git config user.email "ctm-bot@users.noreply.github.com"
          # Build the bump on the newest main. Main moved under 1.0.0 between the
          # validation and the PR, so that PR was born conflicting (#254).
          # Called as `build_branch || ...`, where bash -e is off: every line returns on failure.
          build_branch() {
            local old
            retry git fetch -q origin main || return 1
            git switch -q -C "$BRANCH" origin/main || return 1
            old=$(node scripts/bump_plenix.cjs --current) || return 1
            node scripts/bump_plenix.cjs "$NEW" >/dev/null || return 1
            if git diff --quiet; then echo "main is already on Plenix $NEW"; return 3; fi
            git add -u || return 1   # the bump only edits tracked files; logs and .tmp stay out
            git commit -qm "chore(plenix): upgrade CDN $old -> $NEW" || return 1
            retry git push -q -f origin "$BRANCH" || return 1
          }
          build_branch || { [ $? -eq 3 ] && exit 0; exit 1; }
          printf 'Automatic Plenix CDN upgrade to **%s**.\n\nValidated in run %s: CDN files exist, pins/styling, frontend contract tests, shell tests, browser smoke against the real CDN.\n\n### Screenshots\n%s\n' \
            "$NEW" "$RUN_URL" "$SHOTS" > .pr.md
          url=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty')
          [ -n "$url" ] || url=$(retry gh pr create --base main --head "$BRANCH" --title "chore(plenix): upgrade CDN to $NEW" --body-file .pr.md)
          retry gh pr merge "$url" --squash --auto
          echo "Auto-merge set on $url (merges when the required checks pass)" >> "$GITHUB_STEP_SUMMARY"
          # GitHub holds pull_request runs on a bot-opened PR as "action_required", which blocks the
          # merge; approve our own branch's runs. If main moves into a conflict, rebuild the
          # branch on the new main (at most 3 times). Every push ends by starting the
          # required checks, because a GITHUB_TOKEN push starts no workflows.
          rebuilt=0
          retry gh workflow run quality.yml --ref "$BRANCH"
          retry gh workflow run backend.yml --ref "$BRANCH"   # postgres is required too (issue 46)
          retry gh workflow run db-owner-guard.yml --ref "$BRANCH" -f pr="${url##*/}"   # required too (issue 67)
          state=OPEN
          for _ in $(seq 1 90); do
            for id in $(gh run list --branch "$BRANCH" --event pull_request --json databaseId,conclusion,status --jq '.[] | select(.conclusion == "action_required" or .status == "waiting") | .databaseId'); do
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve" >/dev/null 2>&1 || gh run rerun "$id" >/dev/null 2>&1 || true
            done
            read -r state mergeable < <(gh pr view "$url" --json state,mergeable --jq '"\(.state) \(.mergeable)"' || echo "OPEN UNKNOWN")
            [ "$state" = MERGED ] && break
            [ "$state" = CLOSED ] && { echo "::warning::$url was closed without merging"; exit 0; }
            if [ "$mergeable" = CONFLICTING ] && [ "$rebuilt" -lt 3 ]; then
              rebuilt=$((rebuilt + 1)); echo "main moved into a conflict; rebuilding $BRANCH (#$rebuilt)"
              build_branch || { [ $? -eq 3 ] && { gh pr close "$url" --comment "main already has Plenix $NEW. — ctm3-release-engineer (plenix-upgrade.yml)"; exit 0; }; exit 1; }
              retry gh pr merge "$url" --squash --auto
              retry gh workflow run quality.yml --ref "$BRANCH"
              retry gh workflow run backend.yml --ref "$BRANCH"
              retry gh workflow run db-owner-guard.yml --ref "$BRANCH" -f pr="${url##*/}"
            fi
            sleep 30
          done
          if [ "$state" != MERGED ]; then
            echo "::error::$url has not merged after 45 minutes ($mergeable)"; exit 1
          fi
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" >/dev/null 2>&1 || true
          # A merge made with GITHUB_TOKEN starts no push workflows, so start the live deploy (#90).
          retry gh workflow run deploy.yml --ref main
          echo "Merged; live deploy started" >> "$GITHUB_STEP_SUMMARY"

      - name: Report a stuck upgrade
        # Not a Plenix defect (validation passed): CTM's own pipeline did not land it.
        # One open `plenix-upgrade-stuck` issue collects these; PDS watches it (#254).
        if: always() && (steps.bump.outputs.stuck != '' || steps.merge.outcome == 'failure' || steps.bump.outcome == 'failure')
        env:
          STUCK: ${{ steps.bump.outputs.stuck }}
          MERGE: ${{ steps.merge.outcome }}
          NEW: ${{ steps.bump.outputs.new }}
          HAS_BOT_TOKEN: ${{ secrets.CTM_BOT_TOKEN != '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          msg="Plenix ${NEW:-?} auto-upgrade did not land by itself (run $RUN_URL)."
          [ -n "$STUCK" ] && msg="$msg"$'\n\n'"- $STUCK"
          [ "$MERGE" = failure ] && msg="$msg"$'\n\n'"- The merge step failed (see the run log)."
          [ "$HAS_BOT_TOKEN" = true ] || msg="$msg"$'\n\n'"- \`CTM_BOT_TOKEN\` is not set; the run uses GITHUB_TOKEN plus explicit dispatches."
          msg="$msg"$'\n\n'"— ctm3-release-engineer (plenix-upgrade.yml)"
          gh label create plenix-upgrade-stuck --color B60205 --force >/dev/null 2>&1 || true
          issue=$(gh issue list --state open --label plenix-upgrade-stuck --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$msg"
          else
            gh issue create --title "Plenix auto-upgrade stuck" --label plenix-upgrade-stuck --label type:bug --label area:release --label agent:ctm3-release-engineer --body "$msg"
          fi

      - name: Report a breaking upgrade as a bug
        if: steps.bump.outputs.changed == 'true' && !(steps.files.outcome == 'success' && steps.contract.outcome == 'success' && steps.node.outcome == 'success' && steps.shell.outcome == 'success' && steps.smoke.outcome == 'success')
        env:
          SHOTS: ${{ steps.shots.outputs.md }}
        run: |
          for l in "type:bug" "sev:S2" "area:frontend" "agent:ctm3-frontend-engineer" "plenix-upgrade"; do gh label create "$l" --force >/dev/null 2>&1 || true; done
          {
            echo "Plenix **${{ steps.bump.outputs.new }}** (CTM is on **${{ steps.bump.outputs.old }}**) failed CTM validation, so CTM was not upgraded."
            echo
            echo "| Check | Result |"; echo "|---|---|"
            echo "| CDN files exist | ${{ steps.files.outcome }} |"
            echo "| Pins and styling | ${{ steps.contract.outcome }} |"
            echo "| Frontend contract tests | ${{ steps.node.outcome }} |"
            echo "| Shell tests | ${{ steps.shell.outcome }} |"
            echo "| Browser smoke (real CDN) | ${{ steps.smoke.outcome }} |"
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            for f in .files.log .contract.log .node.log .shell.log .smoke.log; do
              [ -s "$f" ] && { echo; echo "<details><summary>$f (last 60 lines)</summary>"; echo; echo '```'; tail -60 "$f"; echo '```'; echo "</details>"; }
            done
            echo; echo "Fix: run \`node scripts/bump_plenix.cjs ${{ steps.bump.outputs.new }}\` on a branch, adapt CTM to the new Plenix API (or report a Plenix defect upstream), and merge. The auto-upgrade retries on the next release."
            echo; echo "### Screenshots"; echo "$SHOTS"
          } > .issue.md
          ctm_issue=$(gh issue create --title "Plenix ${{ steps.bump.outputs.new }} breaks CTM" --body-file .issue.md \
            --label "type:bug,sev:S2,area:frontend,agent:ctm3-frontend-engineer,plenix-upgrade")
          echo "ctm_issue=$ctm_issue" >> "$GITHUB_OUTPUT"
        id: report

      - name: PDS GitHub App not set up yet
        if: steps.report.outputs.ctm_issue != '' && env.PDS_APP_ID == ''
        env:
          CTM_ISSUE: ${{ steps.report.outputs.ctm_issue }}
        run: echo "::warning::PDS_APP_ID / PDS_APP_PRIVATE_KEY are not set, so no issue was opened in plenix-ds/pds. The CTM issue is $CTM_ISSUE."
      - name: Mint a PDS app token (plenix-ds/pds, issues only)
        id: pds-app
        if: steps.report.outputs.ctm_issue != '' && env.PDS_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.PDS_APP_ID }}
          private-key: ${{ secrets.PDS_APP_PRIVATE_KEY }}
          owner: plenix-ds
          repositories: pds
          permission-issues: write
      - name: Tell the PDS team (issue in plenix-ds/pds)
        if: steps.pds-app.outputs.token != ''
        env:
          PDS_TOKEN: ${{ steps.pds-app.outputs.token }}
          CTM_ISSUE: ${{ steps.report.outputs.ctm_issue }}
          NEW: ${{ steps.bump.outputs.new }}
        run: |
          title="CTM: Plenix $NEW breaks CTM"
          { echo "CTM's automatic upgrade to Plenix **$NEW** failed. Logs, check results and screenshots: $CTM_ISSUE"; echo; cat .issue.md; } > .pds.md
          existing=$(GH_TOKEN="$PDS_TOKEN" gh issue list --repo plenix-ds/pds --state open --search "\"$title\" in:title" --json url --jq '.[0].url // empty')
          if [ -n "$existing" ]; then
            GH_TOKEN="$PDS_TOKEN" gh issue comment "$existing" --repo plenix-ds/pds --body "Failed again in ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. CTM issue: $CTM_ISSUE"
            pds="$existing"
          else
            pds=$(GH_TOKEN="$PDS_TOKEN" gh issue create --repo plenix-ds/pds --title "$title" --body-file .pds.md)
          fi
          gh issue comment "$CTM_ISSUE" --body "Reported to the PDS team: $pds — ctm3-release-engineer"
