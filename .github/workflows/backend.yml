name: CTM backend validation
on: [push, pull_request]
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ctm_validation
          POSTGRES_USER: ctm_validation
          POSTGRES_PASSWORD: ci-isolated-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ctm_validation"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CTM_TEST_DATABASE_URL: postgres://ctm_validation:ci-isolated-only@localhost:5432/ctm_validation
      DJANGO_SECRET_KEY: ci-only-not-production
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
      - run: uv sync --frozen --python 3.12
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate combined applicant and council frontend
        run: node --test tests/frontend/*.test.cjs
      - run: uv run python manage.py makemigrations --check --dry-run --settings=ctm.settings_postgres_test
      - run: uv run pytest --ds=ctm.settings_postgres_test -q
      - run: uv run python docs/architecture/build-spec/validate_spec.py
      - name: Build non-root application image
        run: docker build --file deploy/Dockerfile --tag ctm-ci .
      - name: Verify image assets and private-volume initialization
        run: |
          volume="ctm-ci-media-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "$volume"
          trap 'docker volume rm "$volume"' EXIT
          docker run --rm --network none --user 0:0 --volume "$volume:/srv/ctm/media" ctm-ci python -c "from pathlib import Path; Path('/srv/ctm/media/existing').write_text('synthetic')"
          docker run --rm --network none --read-only --user 0:0 --cap-drop ALL --cap-add CHOWN --cap-add FOWNER --cap-add DAC_READ_SEARCH --security-opt no-new-privileges:true --volume "$volume:/srv/ctm/media" ctm-ci python -m ctm.storage_init
          docker run --rm --network none --read-only --user 0:0 --cap-drop ALL --cap-add CHOWN --cap-add FOWNER --cap-add DAC_READ_SEARCH --security-opt no-new-privileges:true --volume "$volume:/srv/ctm/media" ctm-ci python -m ctm.storage_init
          docker run --rm --network none --read-only --volume "$volume:/srv/ctm/media" ctm-ci python -c "from pathlib import Path; import os; assert os.getuid()==1000; assert Path('/srv/ctm/static/ctm/app.js').is_file(); assert Path('/srv/ctm/media/existing').stat().st_uid==0; p=Path('/srv/ctm/media/write-probe'); p.write_text('synthetic'); p.unlink(); assert Path('/srv/ctm/media').stat().st_mode & 0o777 == 0o700"
      - name: Verify production HTTP and static serving
        run: |
          name="ctm-ci-web-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export DATABASE_URL="$CTM_TEST_DATABASE_URL"
          docker run --detach --name "$name" --network host --env DATABASE_URL --env DJANGO_SECRET_KEY=ci-http-only-not-production --env CTM_TRUST_PROXY_SSL=true ctm-ci gunicorn ctm.wsgi:application --bind 127.0.0.1:18000 --workers 1 --threads 1
          trap 'docker rm --force "$name"' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail --max-time 3 -H 'Host: ctm.lighthouseway.org' -H 'X-Forwarded-Proto: https' http://127.0.0.1:18000/health/ > /dev/null; then break; fi
            sleep 1
          done
          curl --silent --show-error --fail --max-time 5 -H 'Host: ctm.lighthouseway.org' -H 'X-Forwarded-Proto: https' http://127.0.0.1:18000/health/
          curl --silent --show-error --fail --max-time 5 -H 'Host: ctm.lighthouseway.org' -H 'X-Forwarded-Proto: https' http://127.0.0.1:18000/ -o "$RUNNER_TEMP/ctm-login.html"
          grep -q 'ctm-root' "$RUNNER_TEMP/ctm-login.html"
          curl --silent --show-error --fail --max-time 5 -H 'Host: ctm.lighthouseway.org' -H 'X-Forwarded-Proto: https' http://127.0.0.1:18000/static/ctm/app.js -o "$RUNNER_TEMP/ctm-app.js"
          cmp static/ctm/app.js "$RUNNER_TEMP/ctm-app.js"
