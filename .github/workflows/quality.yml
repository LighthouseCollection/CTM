name: CTM quality gates
# Required checks on main (docs/implementation/sdlc.md section 7).
# Diff-aware: existing debt is reported, only NEW problems block.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:   # started by plenix-upgrade.yml on its branch (bot PRs do not trigger workflows)

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  fast-gates:
    name: Fast gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Resolve base commit
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: echo "BASE=${PR_BASE:-HEAD~1}" >> "$GITHUB_ENV"
      - name: Plenix CDN pin and styling (changed files)
        run: node scripts/check_frontend_contract.cjs --base "$BASE"
      - name: Migration lint
        run: node scripts/check_migration_diff.cjs "$BASE"
      - name: Ownership
        run: node scripts/check_ownership.cjs --base "$BASE"
      - name: Role registry (template checks 13 and 15)
        run: node scripts/check_registry.cjs
      - name: English and Arabic keys (new problems)
        run: node scripts/check_i18n.cjs --base "$BASE"
      - name: No GITHUB_TOKEN hand-off without a dispatch (template check 16)
        run: node scripts/check_handoffs.cjs
      - name: Build-spec sources unchanged (validate_spec.py, stdlib only)
        run: python3 docs/architecture/build-spec/validate_spec.py > /dev/null
      - name: Claude and Codex instructions in sync (Rulesync)
        run: |
          npx --yes rulesync@43.6.0 generate
          git diff --exit-code -- CLAUDE.md AGENTS.md || { echo "::error::Edit .rulesync/, then run: npx rulesync@43.6.0 generate"; exit 1; }

  decisions:
    name: Decisions have checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.8.22'
      - run: uv run --no-project --python 3.12 --with pyyaml==6.0.3 python scripts/check_decisions.py

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node --test tests/frontend/*.test.cjs

  opengrep:
    name: Opengrep
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # reviewdog comments on changed lines
    env:
      OPENGREP_VERSION: v1.33.1
      OPENGREP_SHA256: 46e8133cc490f9f50518061590ce2f6be5a08afaeda034471c0ceda4b3899808
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Opengrep (pinned, checksum verified)
        run: |
          curl -fsSL -o /usr/local/bin/opengrep "https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}/opengrep_manylinux_x86"
          echo "${OPENGREP_SHA256}  /usr/local/bin/opengrep" | sha256sum -c -
          chmod +x /usr/local/bin/opengrep
          opengrep --version
      - uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
      - name: Scan CTM rules (new findings only)
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          opengrep scan --config .opengrep/ctm.yml --baseline-commit "${PR_BASE:-HEAD~1}" \
            --sarif --output opengrep.sarif --error
      - name: Show findings on changed lines (presentation only)
        if: always() && github.event_name == 'pull_request'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: '[ -s opengrep.sarif ] && reviewdog -f=sarif -name=opengrep -reporter=github-pr-review -filter-mode=added -fail-level=none < opengrep.sarif || true'

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.8.22'
      - name: Workflow security (pinned actions, permissions, injection)
        run: uvx --python 3.12 zizmor@1.32.0 --no-online-audits --min-severity medium --format github .github/workflows
