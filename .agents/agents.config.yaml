# CTM (CTM4): the role registry (plan §5.1). Generated by dispatch kit 3.4.5 (Project Plan 3.4.5).
# Do not edit. The intake is the source: change it with `dispatch.py set`, rebuild, and commit this file by a PR that links a
# recorded decision. CI fails if this file differs from what the intake generates (plan §9.2 check 11).

project: ctm
name: 'CTM'
repo: LighthouseCollection/CTM
default_branch: main
teams: [core]             # the first is the lead team; every member has the same access and permissions
merge_rights: self-merge
merge_roles: [pm, design-director, architect, delivery-lead, engineer, database-engineer, i18n-engineer, technical-writer, debugger]
release_roles: []   # metadata: who opens the release PR (CI does the release)

settings:
  slots: 4                  # agents running at once per team, PM excluded
  reserved_gate_slots: 2    # usable only by PR review gates (G5a-G5e)
  idle_exit_min: 5            # an idle agent is nudged, then closed after the same time again
  ready_min: 3                # Ready items per active lane (advisory: the PM keeps it)
  memory_gb: 2.5             # per agent session
  pm_memory_gb: 3
  priority: [release, integrate, verify, build, design, spec, evergreen]   # advisory: the PM's order when slots are scarce

runtimes:                          # plan §5.11: the agent tool plus its models per tier
  claude-code: { tool: 'Claude Code', tiers: { small: 'haiku', standard: 'sonnet', capable: 'opus' }, remote_access: true, hooks: true, instructions: CLAUDE.md }

roles:
  - id: pm
    title: 'PM'
    kind: coordinator
    runtime: claude-code
    tier: capable            # opus
    label: "agent:ctm-pm"
    definition: .agents/pm.md
    source: plan
    memory_limit: 3G
    lane: spec
    gate: G1
    merge: true
  - id: design-director
    title: 'Design Director'
    kind: lane
    runtime: claude-code
    tier: capable            # opus
    label: "agent:ctm-design-director"
    definition: .agents/design-director.md
    source: plan
    memory_limit: 2.5G
    lane: design
    gate: G2
    merge: true
  - id: architect
    title: 'Solution Architect'
    kind: lane
    runtime: claude-code
    tier: capable            # opus
    label: "agent:ctm-architect"
    definition: .agents/architect.md
    source: plan
    memory_limit: 2.5G
    lane: architecture
    gate: G3
    merge: true
  - id: delivery-lead
    title: 'Delivery Lead'
    kind: lane
    runtime: claude-code
    tier: standard            # sonnet
    label: "agent:ctm-delivery-lead"
