[project]
name = "ctm"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.2,<5.3", "django-allauth[socialaccount]>=65.20,<66",
  "psycopg[binary]>=3.3,<4", "dj-database-url>=3.1,<4",
  "celery[redis]>=5.6,<6", "django-celery-beat>=2.9,<3",
  "gunicorn>=23,<24", "whitenoise>=6.12,<7", "stripe>=14.4,<15",
  "requests>=2.32,<3",
]

[dependency-groups]
dev = ["pytest>=8.4,<9", "pytest-django>=4.14,<5"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "ctm.settings_test"
python_files = ["test_*.py"]
testpaths = ["tests"]

