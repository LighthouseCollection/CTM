# How many CTM agents may run at once. Owner decision D-0025 (2026-11-04),
# same rule as PDS 1.0. Adjust these numbers as needed; agents read this file
# (ctm-delivery-lead schedules by it) instead of a number written in the docs.

long_work:
  # Building a screen or service, a design, a migration, a release.
  max_running: 4

small_tasks:
  # A code review, a lint or typo fix, one test, triaging an issue, a GitHub
  # reply, the daily summary. Run on top of the long-work slots.
  max_running: unlimited       # or a number
  max_minutes: 15              # longer -> stop and queue for a long-work slot

memory:
  # Memory sets the real limit, not the agent count.
  per_agent_limit_gb: 1.5      # each agent session's own limit
  start_new_below_free_gb: 2   # new small tasks wait while free memory is below this
