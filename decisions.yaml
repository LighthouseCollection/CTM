    why: Owner 2026-11-05 on #95 "local copy and live should be the same!" and 2026-11-06 "do Automatic deploys (#90)". VM 107 has 16 GB and no staging stack; the pre-deploy database backup and automatic rollback are the safety net
    options: [Merge deploys live directly (chosen), Merge to staging and tag to production (template default; needs a staging stack)]
    decided_by: owner
    status: active
    check: { kind: workflow, ref: .github/workflows/deploy.yml }

