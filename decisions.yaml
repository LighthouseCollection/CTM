# CTM decision log. Never ask twice: every decision has a date, a reason and the
# check that enforces it (or review_only with a reason). Validated by
# scripts/check_decisions.py; shown on the pinned "CTM dashboard" issue.
#
# check.kind: ci-job  -> ref "<workflow file>#<job id>"
#             workflow -> ref ".github/workflows/<file>"
#             test     -> ref "<test file path>"
#             hook     -> ref "<hook file path>"
#             script   -> ref "<script path>"
#             config   -> ref "<config file path>"
# status: active | superseded | retired
# decided_by: owner | agent:<role>

decisions:
  - id: D-0001
    date: 2026-11-04
    area: process
    decision: Full autonomy. All agents push, merge, run git clean -fdx (own worktree), deploy, run real migrations and work with real data
    why: The owner is the product stakeholder and reporter, not an approval step
    options: [Full autonomy (chosen), Lead-only merges with owner taps]
    decided_by: owner
    status: active
    review_only: A permission setting (.claude/settings.json), enforced by the safety nets in sdlc.md section 3, not by a code rule

  - id: D-0002
    date: 2026-11-04
    area: process
    decision: GitHub is the only channel. Work items are issues; status is generated from GitHub (pinned dashboard and daily summary issues)
    why: Hand-kept status files and dashboards drifted from the truth
    options: [GitHub only (chosen), Separate status pages]
    decided_by: owner
    status: active
    check: { kind: workflow, ref: .github/workflows/dashboard.yml }

  - id: D-0003
    date: 2026-11-04
    area: process
    decision: Agents never stop to wait for the owner. Intent questions become decision cards with the recommended option applied
    why: Waiting for owner taps stalled the previous team
    options: [Apply recommended and report (chosen), Wait for an answer]
    decided_by: owner
    status: active
    review_only: Behaviour of agents, checked in review by ctm3-delivery-lead

  - id: D-0004
    date: 2026-11-04
    area: design
    decision: Pictures, mock-ups and variants only when the owner asks. Every screenshot a check already took is shared on the PR, the issue and the dashboard. English desktop by default; mobile and Arabic only when the change affects them
    why: Owner, 2026-11-04 ("not everything needs a picture")
    options: [Pictures on request, checks' screenshots always shared (chosen), Picture before every UI change]
    decided_by: owner
    status: active
    check: { kind: ci-job, ref: .github/workflows/plenix-upgrade.yml#upgrade }

  - id: D-0005
    date: 2026-11-04
    area: release
    decision: New Plenix CDN releases reach CTM automatically after CTM's checks pass against the real CDN; a failure opens one bug
    why: Owner, 2026-11-04 ("any immediate update to cdn is auto update in the ctm")
    options: [Automatic upgrade (chosen), Owner approves each version]
    decided_by: owner
    status: active
    check: { kind: ci-job, ref: .github/workflows/plenix-upgrade.yml#upgrade }

  - id: D-0006
    date: 2026-11-04
    area: design
    decision: CTM's visual language is Plenix. CTM owns only the layer on top (DESIGN.md) and never restyles Plenix
    why: CTM is an application that consumes the PDS design system from the CDN
    options: [Plenix only (chosen)]
    decided_by: owner
    status: active
    check: { kind: ci-job, ref: .github/workflows/quality.yml#fast-gates }

  - id: D-0007
    date: 2026-11-04
    area: process
    decision: build-spec/ and the question bank are protected from edits; conflicts go to GitHub issues
    why: The specification is the owner's source of truth
    options: [Protected (chosen)]
    decided_by: owner
    status: active
    check: { kind: hook, ref: .claude/hooks/guard-protected.cjs }

  - id: D-0008
    date: 2026-11-04
    area: process
    decision: Only ctm3-database-engineer writes migrations, RLS and grants; one owner per file
    why: Ownership violations caused lost work and broken migrations
    options: [Single owner (chosen)]
    decided_by: owner
    status: active
    check: { kind: ci-job, ref: .github/workflows/quality.yml#fast-gates }

  - id: D-0009
    date: 2026-11-04
    area: process
    decision: At most 4 agent sessions run at once
    why: Same as PDS 1.0; keeps cost and merge conflicts down
    options: [4 (chosen), Unlimited]
    decided_by: owner
    status: superseded
    superseded_by: D-0025
    review_only: Superseded by D-0025 (long work vs small tasks)

  - id: D-0010
    date: 2026-11-04
    area: process
    decision: Tool stack as in PDS 1.0 - Opengrep (not Semgrep), drop SonarQube and PR-Agent, adopt Rulesync, zizmor, lefthook; reviewdog for presentation; every Action pinned to a SHA
    why: PDS 1.0 tool review 2026-11-03 (license, RAM, AI-review noise, drift between Claude and Codex instructions)
    options: [PDS 1.0 stack (chosen), Semgrep + SonarQube + PR-Agent]
    decided_by: owner
    status: active
    check: { kind: ci-job, ref: .github/workflows/quality.yml#zizmor }

  - id: D-0011
    date: 2026-11-04
    area: process
    decision: Codex is on standby, called in only when needed; it reads AGENTS.md generated from the same source as CLAUDE.md
    why: Same as PDS 1.0 decision 2
    options: [Standby (chosen), Standing team member]
    decided_by: owner
    status: active
    check: { kind: ci-job, ref: .github/workflows/quality.yml#fast-gates }

  - id: D-0012
    date: 2026-11-04
    area: i18n
    decision: New Arabic UI words are proposed by ctm3-i18n-engineer from the glossary and docs/i18n/arabic.md, shipped, and listed in docs/i18n/arabic-proposals.md for the owner's batch review. Institutional text is never improvised
    why: Keeps the PDS Arabic standard without blocking work (agents never wait)
    options: ["A (Recommended, applied): ship and batch review - risk: a word may change after release", "B: PDS strict, owner approves every word before it ships - risk: bilingual screens wait on the owner"]
    decided_by: agent:ctm3-product-lead
    status: active
    check: { kind: ci-job, ref: .github/workflows/quality.yml#fast-gates }

  - id: D-0013
    date: 2026-11-04
    area: release
    decision: Releases are on demand, triggered by agents once all checks pass; no owner yes
    why: Same as PDS 1.0 decision 3
    options: [On demand (chosen), Owner approves each release]
    decided_by: owner
    status: active
    check: { kind: workflow, ref: .github/workflows/deploy.yml }

  - id: D-0014
    date: 2026-11-04
    area: process
    decision: The dashboard is a pinned GitHub issue regenerated by CI, not a hosted page
    why: Renders on github.com and the mobile app, needs no hosting or login, and cannot drift from GitHub
    options: ["A (Recommended, applied): pinned issue - risk: long pages scroll", "B: GitHub Pages site - risk: one more thing to host"]
    decided_by: agent:ctm3-product-lead
    status: superseded
    superseded_by: D-0031
    check: { kind: workflow, ref: .github/workflows/dashboard.yml }

  - id: D-0015
    date: 2026-11-04
    area: release
    decision: Merges use branch protection with required checks and auto-merge; GitHub's merge queue is not available for a personal-account repository
    why: CTM lives under a personal account, not an organization
    options: [Auto-merge (chosen), Move the repo to an organization for the merge queue]
    decided_by: agent:ctm3-release-engineer
    status: active
    review_only: Repository setting; ctm3-drift-auditor checks it weekly

  - id: D-0016
    date: 2026-11-04
    area: security
    decision: The repository is public, so no real case data, screenshots of real data, or secrets are ever committed
    why: Anything in git, including the ci-screenshots branch, is public
    options: [Synthetic data only in git (chosen)]
    decided_by: agent:ctm3-security-reviewer
    status: active
    check: { kind: ci-job, ref: .github/workflows/quality.yml#opengrep }

  - id: D-0020
    date: 2026-11-03
    area: workflow
    decision: Moving a council session to another day creates a new dated session; held sessions are locked
    why: Approved design (transactions-and-acceptance section 36, SES01)
    options: [Follow the approved design (chosen), Edit the date in place before the session is held, Correct the date in place even after it was held]
    decided_by: owner
    status: active
    check: { kind: test, ref: tests/test_session_reschedule.py }

  - id: D-0021
    date: 2026-11-03
    area: identity
    decision: A new council member's Microsoft sign-in links automatically on first sign-in - only for someone an admin already added, only with a lacopts.org account, and only once
    why: The database guard from migration 0050 blocked first sign-in for new members
    options: [Link automatically on first sign-in (chosen), Admin types the Microsoft ID]
    decided_by: owner
    status: active
    check: { kind: test, ref: tests/test_provider_callback_lifetime.py }

  - id: D-0022
    date: 2026-11-03
    area: design
    decision: Remove CTM's own style sheet and inline styles, replacing them with Plenix parts, all at once with one preview at the end
    why: No application using Plenix makes its own styles (DR-003)
    options: [One screen at a time with previews, All at once with one preview at the end (chosen), Not now]
    decided_by: owner
    status: active
    check: { kind: ci-job, ref: .github/workflows/quality.yml#fast-gates }

  - id: D-0023
    date: 2026-11-03
    area: release
    decision: CTM shows its version at /version.json with four facts only - name, version, Plenix version, build time
    why: The dashboard shows which CTM version runs
    options: [Build it (chosen), No]
    decided_by: owner
    status: active
    check: { kind: test, ref: tests/test_version_json.py }

  - id: D-0024
    date: 2026-11-03
    area: release
    decision: Wait before moving CTM to Plenix 0.76 (pull request #32)
    why: Owner chose Wait on the CTM 2.0 status page
    options: [Merge it, Wait (chosen)]
    decided_by: owner
    status: superseded
    superseded_by: D-0005
    review_only: Superseded; #32 merged 2026-11-04 on the owner's instruction, then automatic upgrades took CTM to 0.86.0

  - id: D-0025
    date: 2026-11-04
    area: process
    decision: Up to 4 agents on long work (a screen or service, a design, a migration, a release), plus any number of small tasks (a review, a lint or typo fix, one test, triage, a GitHub reply, the daily summary) capped at about 15 minutes each; longer ones queue for a long-work slot. Memory sets the real limit. The numbers live in agent-limits.yaml and can be adjusted as needed
    why: Owner correction, same as PDS 1.0 ("as long as it can be adjusted as needed")
    options: [4 long-work slots + unlimited short tasks, adjustable (chosen), Hard cap of 4 sessions]
    decided_by: owner
    status: active
    check: { kind: config, ref: agent-limits.yaml }

  - id: D-0026
    date: 2026-11-04
    area: release
    decision: Report failed Plenix upgrades to plenix-ds/pds with a personal fine-grained token (PDS_ISSUE_TOKEN)
    why: First version of the PDS link
    options: [Personal token (chosen then), PDS GitHub App]
    decided_by: owner
    status: superseded
    superseded_by: D-0027
    review_only: Superseded by D-0027 before it was set up

  - id: D-0027
    date: 2026-11-04
    area: release
    decision: CTM and PDS talk both ways through the PDS GitHub App - CTM mints an app token (PDS_APP_ID, PDS_APP_PRIVATE_KEY) to open or update issues in plenix-ds/pds when an upgrade fails, and PDS sends repository_dispatch plenix-release to CTM for an instant upgrade. The app is installed on CTM with Issues read/write and Contents read only
    why: Owner decision via the PDS 1.0 plan; no personal tokens, one identity, least privilege. GitHub requires Contents write for repository_dispatch, so with Contents read only the instant trigger is refused and the 30-minute schedule is the fallback
    options: [PDS GitHub App (chosen), Personal fine-grained token]
    decided_by: owner
    status: active
    check: { kind: ci-job, ref: .github/workflows/plenix-upgrade.yml#upgrade }

  - id: D-0028
    date: 2026-11-04
    area: process
    decision: CTM restarts as CTM 3.0 - a continuation of the same project (same GitHub repository, server and code) in the structured environment. All CTM 2.0 environments are retired (CTM 2.0 team, Codex Desktop-R and VM-FRM streams, their branches, PRs and docs; last state tagged ctm2-final). Every agent is named "CTM3 - <role>" (ctm3-* definitions, "CTM3 - <role>" session titles)
    why: Owner, 2026-11-04 ("Restart CTM as 3.0 and retire any existing CTM environments")
    options: [CTM 3.0 continuation (chosen)]
    decided_by: owner
    status: active
    check: { kind: script, ref: scripts/check_decisions.py }

  - id: D-0029
    date: 2026-10-22
    area: design
    decision: Council case overview shows shared marriage and separation facts once, taken from the first formally submitted application; where the other spouse's submitted answer differs, a discrepancy marker beside the field opens both values and their sources. A display projection only - no merge, no overwrite, no automatic council finding; returned private corrections stay hidden until resubmitted
    why: Owner decision on issue #14 (PA01/PA02/PA05), recorded at the CTM 3.0 triage so it is never asked again. Supersedes the earlier side-by-side and confirmed-by-both suggestions. Exact equality, Unknown and correction-source rules are spec work for the PA01 slice
    options: [Shown once with discrepancy marker (chosen), Side by side per spouse, Shown only when both spouses agree]
    decided_by: owner
    status: active
    review_only: Not built yet (#14 PA01/PA02/PA05); the overview slice's test becomes the check

  - id: D-0030
    date: 2026-11-04
    area: security
    decision: The council screen does not show or copy an external priest's private report link by hand. The link goes only by CTM email once email delivery is confirmed working; until then the paper form (print.pdf and paper completion) is the path
    why: The owner kept manual bearer-link delivery unapproved (owner clarifications 2026-10-21, D8(b)/F21), but main showed the link once with Copy link. Decision card on #10; applied default, owner can switch to B
    options: [No manual link, email or paper only (chosen), Keep the shown-once copy link]
    decided_by: agent:ctm3-product-lead
    status: superseded
    superseded_by: D-0033
    check: { kind: test, ref: tests/frontend/council-external.test.cjs }

  - id: D-0031
    date: 2026-11-04
    area: process
    decision: The dashboard is also published as an HTML page on GitHub Pages (https://lighthousecollection.github.io/CTM/), built by the same script and workflow from the same data as the pinned issue; the pinned issue stays
    why: Owner asked for the HTML page (2026-11-04, Product Lead session); replaces the agent decision D-0014. Keeping the issue as well preserves the mobile view at no cost (decision card on #61)
    options: [HTML page and pinned issue (chosen), HTML page only]
    decided_by: owner
    status: active
    review_only: Not built yet (#61); the dashboard workflow's Pages job becomes the check

  - id: D-0032
    date: 2026-11-05
    area: content
    decision: Institutional texts (declarations, medical release, decree templates and the other items on #12) are entered and approved in English and Arabic inside CTM by Admin, President and Secretary only. Each text is versioned; one of those three roles approves a version before it is shown, and an unsupplied text shows a "not yet supplied" state, never sample wording. Agents never write the wording
    why: Owner answered #12 from the dashboard (2026-11-05) "Admin, President, secretary". Read as in-app editing by those roles rather than texts sent to the team; decision card on #12, the owner can switch to B
    options: [Those three roles enter and approve texts in CTM (chosen), Those three people send the texts to the team to load]
    decided_by: owner
    status: active
    review_only: Not built yet (#81); its permission and "not yet supplied" tests become the check

  - id: D-0033
    date: 2026-11-05
    area: security
    decision: CTM itself sends an external priest's private report link, by email or by text message as the council chooses for that priest; nobody shows, copies or forwards the link by hand. Text is offered only once a text-message provider is set up, email once CTM email delivery is confirmed (#54); until then the paper form is the path and the unavailable channel says so
    why: Owner answered on #10 from the dashboard (2026-11-05) "It can be sent via text or email". Read as CTM sending through those channels, which keeps the owner's earlier refusal of manual bearer-link delivery (2026-10-21, D8(b)/F21); decision card on #10, the owner can switch to B. Work in #84
    options: [CTM sends it by email or text (chosen), Council copies the link and sends it by text or email themselves]
    decided_by: owner
    status: active
    check: { kind: test, ref: tests/frontend/council-external.test.cjs }
