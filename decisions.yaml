    area: design
    decision: Navigation panes fit their labels - the main nav keeps the Plenix shell navigation width and folds to its rail while a case is open; the case nav is a SecondaryPane at width "sm" (collapsible, resizable); every nav icon is a Plenix icon so items line up (Appeals uses "reply"); the way back from a case reads "Back to sessions"
    why: Owner 2026-11-07 (#193) "width of the nav bars is too wide"; Appeals was drawn with an 18px SVG, out of line with the 20px Plenix icons
    options: [Plenix widths, small case pane (chosen)]
    decided_by: owner
    status: active
    check: { kind: test, ref: tests/frontend/nav-width.test.cjs }

  - id: D-0048
    date: 2026-11-07
    area: design
    decision: The case navigation pane uses the Plenix SecondaryPane width "md" (replaces "sm" from D-0047) so the longest label, the contract term "Professional Assessments", fits in English and Arabic; terms are never shortened to fit. The main nav stays folded to its rail inside a case
    why: At "sm" (measured 203px) the EN label was cut off (#193, frontend check 2026-11-07); glossary marks the term as Contract
    options: [Plenix "md" width (chosen), Shorten the label (not allowed - contract term)]
    decided_by: agent:ctm3-design-director
    status: active
    check: { kind: test, ref: tests/frontend/nav-width.test.cjs }

  - id: D-0049
    date: 2026-11-07
    area: design
    decision: The Home "For council" tile opens the New applications page on a second view - Tabs "Awaiting review" / "For council" (applications in council consideration), with the view in the URL (/applications/new?view=council); no separate page
    why: The tile had no list to open (#170); both are the managers' application queue, so one ListingPage with two views keeps navigation unchanged
    options: [Second view on New applications (chosen), New page]
    decided_by: agent:ctm3-design-director
    status: active
    check: { kind: test, ref: tests/frontend/application-views.test.cjs }

  - id: D-0050
    date: 2026-11-07
    area: design
    decision: Read-only fields and card headings follow the owner's choice from docs/design/read-only-field-study.html (the starred preset) - card heading 14 px bold dark grey UPPERCASE with icon, a soft tint glow down to an inset (not edge-to-edge) line; group headings 13 px medium gold, 40 px above each group; field label 11 px regular diocese navy, sentence case; value 13 px semibold dark grey; each field on a porcelain tile with a 1 px border in a deeper shade of the same tint; status as a badge. Plenix implements it as the default read-only and card styles (plenix-ds/pds#946); CTM uses the components with no CSS of its own. Recorded in DESIGN.md section 4
    why: Owner 2026-11-07 after iterating the study ("my choices are Card heading 14 px bold dark grey uppercase, tint glow, line inset; Groups 13 px, 40 px apart, medium gold; Label 11 px regular navy; Value 13 px semibold dark grey; Fields on porcelain tiles, medium border"). The owner kept label 11 px and value 13 px over the 12/14 px readability recommendation shown in the study
    options: [Owner choice (chosen), Y Readability (12/14 px), B Fluent field, C Property list, Today]
    decided_by: owner
    status: active
    review_only: "Visual decision; checked by ctm3-design-critic (G5b) against DESIGN.md section 4 and the study's starred preset until Plenix ships it, then by the Plenix visual-regression baselines"

  - id: D-0051
    date: 2026-11-07
    area: design
    decision: Long text in a DataGrid cell (e.g. Previous recommendation) shows the text itself on one line ending in an ellipsis; the full text is in the record's detail panel beside the grid (ListingPage SidePanel); no per-cell buttons or dialogs
    why: Owner 2026-11-07 (#222) "this is not correct, it needs to be updated based on the pds"; Plenix DataGrid guide (one line per cell, detail in a SidePanel)
    options: [Truncated text + detail panel (chosen), Button + dialog per cell (before)]
    decided_by: agent:ctm3-product-lead
    status: superseded
    superseded_by: D-0062
    review_only: "Superseded by D-0062 (#271): the row detail panel is withdrawn; the cell wraps to two lines with a tooltip"

  - id: D-0052
    date: 2026-11-07
    area: workflow
    decision: Admin, president and secretary can move a tribunal session between Draft and In progress any number of times until it is Adjourned; nothing recorded is changed, reminders are not re-sent, each move is audited; a refused change names its reason
    why: Owner 2026-11-07 (#224) "it needs to be allowed due to accidental click"
    options: [Draft and In progress switch freely until Adjourned (chosen), One-way to In progress (before)]
    decided_by: owner
    status: active
    review_only: "Enforced by the #224 backend test once it lands"

  - id: D-0053
    date: 2026-11-07
    area: design
    decision: Council attendance is a plain list (no DataGrid) of council seat holders with photo, name and role in D-0050 typography and a Present/Absent toggle (not a dropdown), a "n of m present" summary and Mark all present; the same component for session and hearing attendance
    why: Owner 2026-11-07 (#229) "This is ugly ... does not need to be in a data grid, use pictures with proper typography, the absent present should not be drop down but toggle"
    options: [Photo list with toggles (chosen), DataGrid with dropdowns (before)]
    decided_by: owner
    status: active
    review_only: "Checked by ctm3-design-critic (G5b) on #229"

  - id: D-0054
    date: 2026-11-07
    area: design
    decision: Adding cases to a session (To assign, Hearings) uses a searchable DataGrid with multi-select in a large dialog, a counted Add button, and an empty state instead of an error; one picker for both actions
    why: Owner 2026-11-07 (#230) "this is bad ui... it should be a datagrid to select"
    options: [DataGrid picker with multi-select (chosen), Single dropdown (before)]
    decided_by: owner
    status: active
    review_only: "Checked by ctm3-design-critic (G5b) on #230"

  - id: D-0055
    date: 2026-11-07
    area: design
    decision: A heading that introduces a table or content block on a page uses the D-0050 card heading style (14 px bold dark grey UPPERCASE with icon); where a page has several such sections each is its own card with the heading as the card header and the table inside; the session agenda (Hearings, To assign) is built this way, amending D-0042's bare full-width tables
    why: Owner 2026-11-07 "the heading outside the table needs to be same as ... card heading. lock that in for other screens but in this screen I would put each section in a card"
    options: [Section heading = card heading; sections as cards (chosen), Smaller page-section headings over bare tables (before)]
    decided_by: owner
    status: active
    review_only: "Checked by ctm3-design-critic (G5b) against DESIGN.md section 4 on every screen in the #217 inventory"

  - id: D-0056
    date: 2026-11-07
    area: workflow
    decision: On an unassigned case, admin, secretary and president assign a council member from the case header (people picker, toast with Undo, then Change); the parties' notice is held for an undo window and discarded if undone, and a later change sends a short "case manager changed" notice
    why: Owner 2026-11-07 (#237) "when something is not assigned, the top assign council member needs to be drop down"; undo-notice ruling by the product lead
    options: [Assign in the header with held party notice (chosen), Assign only through Edit summary (before)]
    decided_by: owner
    status: active
    review_only: "Enforced by the #237 backend and frontend tests"

  - id: D-0057
    date: 2026-11-07
    area: design
    decision: Each spouse is a standard collapsible case card whose title is only the person's name with an Applicant or Respondent badge and photo or initials; all other details are read-only fields in the body; Edit in the header actions; Change photo is a small icon in the photo corner (smallest text link under the photo as fallback), everywhere a photo can be changed
    why: Owner 2026-11-07 (#240) "card is not consistent ... the title should only be name of person with indicator ... the expand/collapse arrow not consistent" and "change photo ... should be discreet"
    options: [Standard card, name + role title, corner photo icon (chosen), Custom row card with inline buttons (before)]
    decided_by: owner
    status: active
    review_only: "Checked by ctm3-design-critic (G5b) on #240"

  - id: D-0058
    date: 2026-11-07
    area: design
    decision: The case timeline groups events by year (year heading with a short line, 80 px between years, a faint rotated year beside each card), puts each event in its own container tinted by its case area (8 areas, Plenix category tokens), with the date in a calendar icon and no dots; Plenix ships it as a Timeline variation and CTM uses it. Spec in DESIGN.md section 4, study in docs/design/timeline-study.html
    why: Owner 2026-11-07 (#242), after iterating on the study, said "lock this in as variation in pds, and implement in ctm"
    options: [Year-grouped, area-coloured containers with calendar date (chosen), Thin dot timeline (before)]
    decided_by: owner
    status: active
    review_only: "Checked by ctm3-design-critic (G5b) against DESIGN.md section 4 and the study; Plenix visual-regression baselines once shipped"

  - id: D-0062
    date: 2026-11-08
    area: design
    decision: No side panel opens when an agenda row is clicked (withdraws the D-0051 detail panel); the Previous recommendation cell wraps to two lines ending in "…" with the full text in a tooltip on hover or keyboard focus, and "Not recorded" when empty (until Plenix supports a two-line cell and a cell tooltip, one line with "…" and the full text on hover); Open and Move stay as the row actions
    why: Owner 2026-11-08 (#271) "I never asked for this" about the right side panel on an agenda row
    options: [Two-line cell + tooltip and no row panel (chosen), Truncated cell + row SidePanel (D-0051, withdrawn)]
    decided_by: owner
    status: active
    check: { kind: test, ref: tests/frontend/council-shell.test.cjs }

  - id: D-0063
    date: 2026-11-09
    area: design
    decision: CTM opens in the Plenix 1366px centered frame (AppShell frame "centered") with the header's toggle to expand to the full window and back, remembered per person; supersedes D-0045. A page that looks cramped in the frame is fixed in its own layout (page kind, columns), not by dropping the frame
    why: Owner 2026-11-09 (CTM#289) "I approved to have the default view that is based on the default size (fluent) with the ability to expand full view"; owner D-0093 in Plenix (pds#862) "for ctm it needs to be 1366 as default". D-0045 had read the owner's #170 "the dashboard looks like crap" as dropping the frame, which he did not say
    options: [1366 frame with expand toggle (chosen), Full window always (D-0045, superseded)]
    decided_by: owner
    status: active
    check: { kind: test, ref: tests/frontend/shell-frame.test.cjs }

  - id: D-0064
    date: 2026-11-08
    area: design
    decision: No skeleton or shimmer placeholders anywhere in CTM; a region that loads uses the Plenix spinner with a label naming what loads (LoadingState, and loading on DataGrid and ListingPage), shown after about a second, announced as busy at once (Plenix D-0130)
    why: Owner 2026-11-08 (#272, pds#1032) "I do not want this loading style view"; again 2026-11-09 (#289) "use the regular standard way similar to fluent"
    options: [Labeled spinner after a second (chosen), Skeleton bars (before)]
    decided_by: owner
    status: active
    check: { kind: test, ref: tests/frontend/council-lists.test.cjs }


  - id: D-0065
    date: 2026-11-10
    area: performance
    decision: "Performance rule 1: the app frame and its code are cached, so the screen appears at once. CTM static files are precompressed (gzip, brotli) and served under content-hashed names with immutable caching (max-age 315360000); the shell HTML is not cached long. Standard in docs/implementation/performance.md"
    why: Owner 2026-11-10 (#311) "The app frame and its code are cached, so the screen appears at once"
    options: ["Hashed, compressed, immutable static files (chosen)", "60-second caching with hand-bumped ?v= stamps (before)"]
    decided_by: owner
    status: active
    check: { kind: config, ref: ctm/settings.py }

  - id: D-0066
    date: 2026-11-10
    area: performance
    decision: "Performance rule 2: code loads per screen, with the next likely screens fetched while idle (within D-0073's limits); applicant screens never load council code and the sign-in page loads only the shared shell. Standard in docs/implementation/performance.md"
    why: Owner 2026-11-10 (#311) "Code loads per screen, with the next likely screens fetched while idle"
    options: ["Per-screen code with idle prefetch (chosen)", "All 25 CTM files on every page (before)"]
    decided_by: owner
    status: active
    review_only: "Reviewed by ctm3-code-reviewer (G5a) against docs/implementation/performance.md until the #308 frontend test lands; then replaced by that check"

  - id: D-0067
    date: 2026-11-10
    area: performance
    decision: "Performance rule 3: one data request per screen, sent in parallel, never in a chain; the session comes with the page HTML, the shell never fetches what the screen fetches, no address is fetched twice per screen, and a save refetches only what it changed. Standard in docs/implementation/performance.md"
    why: Owner 2026-11-10 (#311) "One data request per screen, sent in parallel, never in a chain"; #308 measured 3 to 6 chained steps per page
    options: ["Parallel, deduplicated requests (chosen)", "Chained requests per component (before)"]
    decided_by: owner
    status: active
    review_only: "Reviewed by ctm3-code-reviewer (G5a) against docs/implementation/performance.md until the #308 request-waterfall test lands; then replaced by that check"

  - id: D-0068
    date: 2026-11-10
    area: performance
    decision: "Performance rule 4: data already seen shows at once, then refreshes quietly in the background; forms being edited are never replaced; votes, decisions, decree issue and release, payments and anything about to be signed or sent are always fetched fresh; kept data is memory only and cleared on sign-out. Standard in docs/implementation/performance.md"
    why: Owner 2026-11-10 (#311) "Data you've seen shows at once, then refreshes quietly in the background"
    options: ["Show kept data, refresh quietly (chosen)", "Clear and refetch on every navigation (before)"]
    decided_by: owner
    status: active
    review_only: "Reviewed by ctm3-code-reviewer (G5a) and ctm3-security-reviewer (G5e) against docs/implementation/performance.md until the #308 loader test lands; then replaced by that check"

  - id: D-0069
    date: 2026-11-10
    area: performance
    decision: "Performance rule 5: lists load one page at a time from the server (25 to 50 rows), with search, sort and filters done on the server; counts only count rows the user may see. Contract designed first on #312. Standard in docs/implementation/performance.md"
    why: Owner 2026-11-10 (#311) "Lists load one page at a time from the server (the first 25 to 50 rows), with search and sort done on the server"
    options: ["Server paging, search and sort (chosen)", "Whole list downloaded and sorted in the browser (before)"]
    decided_by: owner
    status: active
    review_only: "Reviewed by ctm3-solution-architect (G3) on the #312 design until its backend and frontend tests land; then replaced by those checks"

  - id: D-0070
    date: 2026-11-10
    area: performance
    decision: "Performance rule 6: saves show at once on screen while the server confirms, and undo with the server's reason if it refuses; votes, decisions, decree issue and release, payments, signing and sending always wait for the server. Built on #313. Standard in docs/implementation/performance.md"
    why: Owner 2026-11-10 (#311) "Saves show at once on screen while the server confirms, and undo if the server refuses"; the exclusions follow CLAUDE.md "Never fake success"
    options: ["Optimistic saves with undo, legal and financial actions excluded (chosen)", "Wait for the server on every save (before)"]
    decided_by: owner
    status: active
    review_only: "Reviewed by ctm3-code-reviewer (G5a) against docs/implementation/performance.md until the #313 tests land; then replaced by those checks"

  - id: D-0071
    date: 2026-11-10
    area: performance
    decision: "Performance rule 7: speed is measured; main content within 2.5 s (LCP) and a click answered within 0.2 s (INP); a CI check on fictional data fails the build when a page gets slower. Agent detail (agent, #314; tunable without the owner): regression ratio 10% over main, noise floors, budgets in one config file, and a page already over budget on main fails only when it gets slower. Standard in docs/implementation/performance.md"
    why: Owner 2026-11-10 (#311) "Speed is measured ... with a check that fails the build when a page gets slower"
    options: ["CI budget check (chosen)", "No measurement (before)"]
    decided_by: owner
    status: active
    review_only: "Enforced by the #314 CI job once it lands (it then becomes this decision's check); until then reviewed by ctm3-release-engineer (G8)"

  - id: D-0072
    date: 2026-11-10
    area: performance
    decision: "Performance rule 8: when idle, the site may fetch larger data in the background so it is ready; only what this user may see and is likely to open next, in small pages, paused while the user is active, never files, Professional Assessments, medical, audit or notifications, memory only, cleared on sign-out. Numeric limits in D-0073. Standard in docs/implementation/performance.md"
    why: Owner 2026-11-10 (#311), the owner's own idea, with those limits in his words
    options: ["Idle prefetch within the owner's limits (chosen)", "No background loading"]
    decided_by: owner
    status: active
    review_only: "Reviewed by ctm3-security-reviewer (G5e) against docs/implementation/performance.md rule 8 until the #308 prefetch test lands; then replaced by that check"

  - id: D-0073
    date: 2026-11-10
    area: performance
    decision: "Idle prefetch limits for D-0072: one step ahead of the current screen only; at most 50 rows per request; starts from an idle callback after 2 s with no input and stops at the next key, click, scroll or touch; at most 2 prefetch requests in flight and 10 prefetched replies kept per screen; never while the tab is hidden, under save-data, or on 2G or slower; no localStorage, sessionStorage, IndexedDB, Cache API or service worker for API data; cleared on sign-out, 401, expired session or account change"
    why: The owner's rule 8 says "small pages" and "paused while the user is active" without numbers; these are the smallest values that still make the next screen ready, and they are cheap to change
    options: ["A Conservative limits as above (chosen)", "B Looser limits (whole lists, 4 in flight, prefetch while active)"]
    decided_by: agent:ctm3-product-lead
    status: active
    review_only: "Reviewed by ctm3-security-reviewer (G5e) until the #308 prefetch test asserts these limits; then replaced by that check"
